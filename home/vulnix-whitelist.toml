# vulnix whitelist, installed by home/security.nix on every host and home
# config. An entry stays only while it suppresses something in at least one
# of their closures; vulnix can scan a config's .drv without building it.
#
# Format: each [section] is a Nix package name (pname). Listing the name
# alone suppresses all CVEs for any version of that package. Add
# `cve = ["CVE-..."]` to scope a rule to specific CVEs only.
#
# No rule here is name-only. Each names a version (`["Diff-1.0.2"]`), the
# CVEs it covers, or both. A name-only rule also silences
# whatever else shares the name, and its future CVEs: `["curl"]`, meant for
# a Rust crate, hid C curl, and `["bytes"]`, meant for a Haskell library,
# hid a real overflow in the Rust `bytes` crate. When a flake update moves a
# pinned version, the false positive comes back and the rule needs bumping.
# That is the intended failure: noisy, not silent.
#
# Run with:  vulnix -w ~/.config/vulnix/whitelist.toml <path>
#
# Categories below:
#   1. Haskell library name collisions  — package name happens to match an
#      unrelated product that has CVEs in NVD.
#   2. Bootstrap / build-time-only      — pulled into the store as build
#      inputs; never executed at runtime, never on PATH.
#   3. Specific known false matches     — e.g. git CVEs that are actually
#      for the Jenkins git plugin.


# =============================================================================
# 1. Haskell library name collisions
# =============================================================================
# Vulnix matches on (name, version) against NVD. The Haskell packaging
# ecosystem has many libraries whose names collide with high-profile CVE
# targets in other ecosystems. Every CVE listed under these entries belongs
# to a completely different product.
#
# Versions are what pandoc's dependency tree builds from the pinned nixpkgs.

["Diff-1.0.2"]
comment = "Haskell textual-diff lib. NVD 'Diff' CVEs are for the Drupal Diff module."

["async-2.2.6"]
comment = "Haskell concurrency lib. NVD CVE-2021-43138 is for npm `async` (prototype pollution)."

["commonmark-0.2.6.1"]
comment = "Haskell CommonMark parser. NVD CVEs are for PHP league/commonmark."

# Not Haskell: the Rust `curl` crate, vendored into a cargo build. Its NVD
# matches are C libcurl CVEs whose "before 7.x" ranges catch 0.4.49 by
# number. C curl (curl-8.x) is a separate derivation and must stay visible.
["curl-0.4.49"]
comment = "Rust curl crate. CVEs are C libcurl version ranges matching a crate version number."

["hedgehog-1.5"]
comment = "Haskell property-based testing lib. NVD 'Hedgehog' CVE is for an unrelated tool."

["network-3.2.8.0"]
comment = "Haskell low-level networking lib. NVD 'network' CVEs are for Network UPS Tools and other unrelated products sharing the name."

["safe-0.3.21"]
comment = "Haskell `safe` lib (total versions of partial functions). NVD CVEs are for unrelated products with 'safe' in the name."

["stringbuilder-0.5.1"]
comment = "Haskell stringbuilder. NVD CVE-2024-21524 is for a JavaScript stringbuilder package."

["vault-0.3.1.6"]
comment = "Haskell `vault` (heterogeneous data store). NVD CVEs are all for HashiCorp Vault, whose pname is also `vault`."

["warp-3.4.9"]
comment = "Haskell Warp web server. NVD 'Warp' CVEs are for Warp Terminal (unrelated Rust app)."

["yaml-0.11.11.2"]
comment = "Haskell yaml library (uses libyaml at the C level). NVD CVEs listed are for Go's go-yaml. The underlying libyaml has its own derivation that is not whitelisted here."

# Haskell `zlib-0.7.x` is a Haskell binding around the C zlib. The CVEs
# in NVD are against the C library (real entries in the store: zlib-1.3.x).
# We whitelist *only* the Haskell version range, not C zlib.
["zlib-0.7.1.1"]
comment = "Haskell zlib bindings. The CVEs listed are for the C zlib library (zlib-1.3.x, which is NOT whitelisted here)."

# The `.cabal` companion derivations are metadata-only; same FPs apply.
["hedgehog-1.5-r2.cabal"]
comment = "Cabal metadata for Haskell hedgehog, see [hedgehog-1.5]."

["safe-0.3.21-r1.cabal"]
comment = "Cabal metadata for Haskell safe, see [safe-0.3.21]."

["yaml-0.11.11.2-r2.cabal"]
comment = "Cabal metadata for Haskell yaml, see [yaml-0.11.11.2]."


# =============================================================================
# 2. Bootstrap / build-time-only derivations
# =============================================================================
# These exist in /nix/store because they were inputs during builds. They
# are not on PATH, are not invoked at runtime, and (in the bootstrap case)
# are intentionally pinned to old versions to make the build chain
# reproducible. Vulnerabilities in them do not represent runtime exposure.

["go-1.24.13-linux-amd64-bootstrap"]
comment = "Stage-0 Go bootstrap binary used only to build the runtime Go. Not on PATH, not executed by user code."

["python-2.7.18.12"]
comment = "Python 2 pulled in as a build helper by older nixpkgs build scripts. Not on PATH; not runnable as `python`."

["pip-20.3.4-source"]
comment = "Source tarball for old pip used during Python bootstrap. Not installed or invokable."

["setuptools-44.0.0-source"]
comment = "Source tarball for old setuptools used during Python bootstrap. Not installed or invokable."

["wheel-0.37.1-source"]
comment = "Source tarball for old wheel used during Python bootstrap. Not installed or invokable."

["gcc-4.6.4"]
comment = "Ancient bootstrap GCC. Used to compile the next-stage GCC; never invoked by user code."

["gcc-10.4.0"]
comment = "Bootstrap-chain GCC. Not the runtime GCC."

# CVE-2023-4039 is the aarch64 stack-protector gap for dynamically-sized
# locals. The Pis are aarch64, so "x86_64 only" does not cover it. It holds
# because the fix shipped in GCC 14, and NVD's range has no upper bound.
["gcc-15.2.0"]
cve = ["CVE-2023-4039"]
comment = "Disputed aarch64 stack-protector gap, fixed upstream before GCC 15."

["binutils-2.46"]
comment = "Build-time linker/assembler. CVEs are crashes parsing crafted object files, only reachable by pointing ld/objdump at untrusted binaries."

["ninja-1.13.2"]
comment = "Build system used at compile time. CVE-2021-4336 is escape-sequence handling in build status output."

["yasm"]
cve = [
  "CVE-2021-33454", "CVE-2021-33455", "CVE-2021-33456", "CVE-2021-33457",
  "CVE-2021-33458", "CVE-2021-33459", "CVE-2021-33460", "CVE-2021-33461",
  "CVE-2021-33462", "CVE-2021-33463", "CVE-2021-33464", "CVE-2021-33465",
  "CVE-2021-33466", "CVE-2021-33467", "CVE-2021-33468", "CVE-2023-30402",
  "CVE-2023-31972", "CVE-2023-31973", "CVE-2023-31974", "CVE-2023-31975",
  "CVE-2023-51258",
]
comment = "Assembler used by build (ffmpeg/codecs). CVEs are crashes on crafted asm input, build-time only."

["gzip-1.2.4"]
comment = "Ancient bootstrap gzip. CVE-2022-1271 is zgrep/zless arg parsing; not invoked at runtime."

["inetutils"]
cve = ["CVE-2026-32772"]
comment = "Bootstrap inetutils. Low-severity CVE-2026-32772."

["fontforge"]
cve = ["CVE-2025-15276", "CVE-2025-15277", "CVE-2025-15278"]
comment = "Font editor build dep. CVEs require loading malicious fonts in fontforge itself, not at runtime."

# jbig2dec, libsndfile, libtpms and libmicrohttpd-1.0.2 used to be listed
# here as build-only. On forge they are in the running system, under
# ghostscript, libpulseaudio, gnupg and systemd, so they are not listed and
# their CVEs show up in a scan.


# =============================================================================
# 3. Specific known false matches
# =============================================================================
# Cases where vulnix flags the right name but NVD has the wrong product
# attribution, so we suppress only the specific CVEs.

["git"]
cve = [
  # All of the below are for the **Jenkins Git plugin**, not the git binary.
  "CVE-2022-36882",
  "CVE-2022-30947",
  "CVE-2022-36883",
  "CVE-2022-38663",
  "CVE-2021-21684",
  "CVE-2022-36884",
]
comment = "Jenkins Git plugin CVEs — incorrectly attributed in NVD to product `git`."

# Not the Haskell HTML5 parser this was once filed under: nodejs links the
# ada-url C++ library, which is in the running system and whose own CVEs
# must stay visible.
["ada"]
cve = ["CVE-2024-9410"]
comment = "CVE-2024-9410 is SSRF in Ada.cx's Sentry setup, unrelated to ada-url."

["cargo"]
cve = [
  "CVE-2026-14363", "CVE-2026-39837", "CVE-2026-39839", "CVE-2026-39840",
  "CVE-2026-39841", "CVE-2026-58519", "CVE-2026-58521",
]
comment = "All are for the MediaWiki Cargo extension, not Rust's cargo."

["dash"]
cve = ["CVE-2024-21485"]
comment = "CVE-2024-21485 is for Plotly's Python `dash` packages, not the dash shell."

["mercurial"]
cve = ["CVE-2022-43410"]
comment = "CVE-2022-43410 is for the Jenkins Mercurial plugin, not hg."

["rubygems"]
cve = ["CVE-2022-36073"]
comment = "CVE-2022-36073 is an account-takeover bug on the rubygems.org site, not the local gem tool."

# nixpkgs' `lapack-3` is a wrapper named for the LAPACK interface version.
# What it wraps (OpenBLAS and reference LAPACK) is scanned under its own
# names, so a real LAPACK CVE still shows up there.
["lapack-3"]
cve = ["CVE-2021-4048"]
comment = "OOB read fixed in LAPACK 3.10.1 and OpenBLAS 0.3.18; matches the wrapper's '3' by number."

# Both CVEs affect "v1.0.2 and earlier"; 1.0.6 matches only because NVD
# records no upper bound. libmicrohttpd-1.0.2 is not whitelisted.
["libmicrohttpd-1.0.6"]
cve = ["CVE-2025-59777", "CVE-2025-62689"]
comment = "Fixed before 1.0.6; NVD's range has no upper bound."
