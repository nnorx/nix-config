name: Check

# Pull requests, and main once they merge. A push trigger on every branch ran
# preflight twice for each pull request from a branch in this repo, the weekly
# flake.lock bump's included, to the same verdict. pr-handoff pushes a branch
# and opens its pull request in one run, so no branch waits on a push run to
# be checked.
on:
  push:
    branches: [main]
  pull_request:

# The token checks out the repo and nothing else: preflight's summary is a
# file the runner reads, not an API call, and the Cachix steps below are
# read-only with no token. So an action or flake input that turned hostile
# here finds a token that can only read, whatever the repository's default.
permissions:
  contents: read

# The DeterminateSystems actions export OpenTelemetry traces and logs to their
# vendor by default, debug lines included. GitHub masks secrets only in the
# workflow log, so whatever an action logs reaches that endpoint unmasked.
# Nothing secret is logged today, but that rests on upstream code, and the
# other workflows hold the Cachix and flake-update tokens. Off everywhere, so
# no workflow is the exception. `diagnostic-endpoint: ""` on the installer
# step turns off the installer binary's separate report.
env:
  OTEL_SDK_DISABLED: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so preflight has origin/main and the commit it
          # compares against.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-09
        with:
          diagnostic-endpoint: ""

      # The same command a change is checked with locally: formatting, every
      # host's toplevel and every Home Manager config evaluated, and which of
      # them the change touches, written to the run's summary. Evaluation
      # only, so it needs no aarch64 builder and cannot turn into a
      # multi-hour build. scripts/preflight.sh says why each step is there.
      #
      # On a pull request HEAD is the merge commit, and the base is the tip of
      # the branch it targets, which for a stacked PR is not main, so the
      # summary says what merging this PR would change. A push is only ever to
      # main, where there is no base branch, and preflight compares main with
      # its previous commit: what the squash-merged PR changed.
      #
      # All of preflight but flake check, which `flake-check` runs beside it.
      - run: nix run .#preflight -- --flake-check skip ${GITHUB_BASE_REF:+--base "origin/$GITHUB_BASE_REF"}

  # Preflight's `nix flake check`, on a runner of its own. In one job it and
  # the evaluations ran in a row, since flake check alone peaks near 12 GB
  # and could not share a 16 GB runner with them. Side by side, a pull request
  # waits for the slower of the two rather than both. The same trigger as
  # `check`, and like it a required check on main.
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Determinate Nix refuses a shallow clone as a
          # git+file flake, since it cannot count its commits (revCount).
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-09
        with:
          diagnostic-endpoint: ""
          # One evaluator thread. The runner's Determinate Nix evaluated flake
          # check's outputs in parallel, and on four vCPUs that took 660 s,
          # where forge's upstream Nix evaluates them one at a time in 96 s.
          # At 1, Determinate Nix's executor is off and flake check is serial.
          extra-conf: eval-cores = 1
      # Fails the job, rather than warning in nix.conf's parse, if the
      # installed Nix has dropped or renamed the setting.
      - run: nix config show eval-cores
      - run: nix run .#preflight -- --flake-check only

  # Builds each fleet host's /etc on pull requests. `check` only evaluates,
  # and some failures only happen at build time: shellcheck on every
  # writeShellApplication script (alerts, host-status, the offbox push and
  # stage scripts, unifi's inform-host seeding), and gate's nftables ruleset
  # and Kea config checks. Without this such a change merges green, then
  # cache.yml fails, and the Pis, which only substitute, fail their nightly
  # upgrade until a fix is merged.
  #
  # /etc holds every systemd unit and so every service script, but not the
  # kernel, so this costs minutes rather than the hours of a Pi 4 kernel
  # compile. On the arm runner for the Pis, natively, as cache.yml does.
  #
  # Pull requests only: on main, cache.yml builds the whole toplevels. Unlike
  # cache.yml, a superseded run is worth nothing here, since nothing is
  # pushed, so a new commit cancels it.
  build-etc:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            hosts: core4 lifeline core5
          - runner: ubuntu-latest
            hosts: gate
    runs-on: ${{ matrix.runner }}
    # A flake.lock bump can rebuild core5's 16k-page packages that are not in
    # the cache yet, and run into this. That says the bump is heavy, not that
    # it is broken.
    timeout-minutes: 120
    concurrency:
      group: build-etc-${{ github.ref }}-${{ matrix.runner }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-09
        with:
          diagnostic-endpoint: ""
      # Read-only: no authToken. A pull request's build must never reach the
      # cache every host trusts.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nnorx-nix-config
      - run: |
          args=()
          for h in ${{ matrix.hosts }}; do
            args+=(".#nixosConfigurations.$h.config.system.build.etc")
          done
          nix build --no-link --print-build-logs --accept-flake-config "${args[@]}"

  # Runs the NixOS VM tests on pull requests. `check` only evaluates them, so
  # without this a change that breaks gate's firewall or DNS tests, the main
  # protection for the one host with no fallback router, merges green.
  #
  # Every pull request, with no path filter: the tests import host modules
  # and lib/net.nix, and a filter that missed an import would let a break
  # through. vm-tests-list lists the tests by evaluating checks.x86_64-linux,
  # so a new one is covered without editing this file.
  #
  # One test per runner. Each boots four or five VMs, and a runner has four
  # vCPUs. Some assertions are timing-bound: gate-dns wants a refusal within
  # a second, and gate-iot-egress reads a 5-second socket timeout as
  # "blocked". Tests contending for CPU could fail, or pass, for the wrong
  # reason. In a row on one runner they took 9 to 14 minutes; side by side
  # the wait is the slowest test plus setup. Each test is its own check,
  # `vm-tests (<name>)`, and fail-fast is off, so one failure neither hides
  # nor cancels another.
  #
  # PR-only, cancel-in-progress and read-only Cachix for the same reasons as
  # build-etc. cache-vm-tests.yml builds the tests on main and pushes them,
  # so a test whose inputs this pull request leaves alone is copied from the
  # cache rather than run, and only the tests it touches boot VMs here.
  vm-tests-list:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vm-tests-list-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-09
        with:
          diagnostic-endpoint: ""
      # The eval is its own assignment so that `bash -e` stops on its failure,
      # which a pipe or process substitution would swallow. An empty list
      # fails here too. Either would otherwise leave no tests to run and a
      # green check.
      - id: list
        run: |
          names=$(nix eval --json --accept-flake-config .#checks.x86_64-linux --apply builtins.attrNames)
          if ! jq -e 'length > 0' <<<"$names" >/dev/null; then
            echo "no tests in checks.x86_64-linux" >&2
            exit 1
          fi
          echo "VM tests: $(jq -r 'join(" ")' <<<"$names")"
          echo "tests=$names" >>"$GITHUB_OUTPUT"

  vm-tests:
    needs: vm-tests-list
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.vm-tests-list.outputs.tests) }}
    runs-on: ubuntu-latest
    # On forge the tests take 31 to 86 seconds each. A runner is slower, a
    # fresh store fetches every VM's closure, and a flake.lock bump can leave
    # some of it to build.
    timeout-minutes: 60
    # The test's name in the group, or every test's job would share one group
    # and each would cancel the others.
    concurrency:
      group: vm-tests-${{ github.ref }}-${{ matrix.test }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-09
        with:
          diagnostic-endpoint: ""
          # The tests require the `kvm` system feature. On GitHub's runners
          # /dev/kvm exists but the runner user cannot open it. This input
          # adds a udev rule opening it to every user before Nix is installed,
          # so Nix detects it and offers `kvm`. It is the default, set here
          # so the job does not rest on one. Without KVM, Nix refuses to build
          # the tests rather than running them slowly under emulation.
          kvm: true
      # Read-only: no authToken. A pull request's build must never reach the
      # cache every host trusts.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nnorx-nix-config
      # So the log shows whether the runner has KVM before the test starts.
      # `ls` fails the step if /dev/kvm is missing.
      - run: |
          ls -l /dev/kvm
          nix config show system-features
      # The name comes from the pull request's own flake, so it reaches the
      # shell as a variable rather than pasted into the script.
      - env:
          TEST: ${{ matrix.test }}
        run: nix build --no-link --print-build-logs --accept-flake-config ".#checks.x86_64-linux.$TEST"
