name: Check
on: [push, pull_request]

# The DeterminateSystems actions export OpenTelemetry traces and logs to their
# vendor by default, debug lines included. GitHub masks secrets only in the
# workflow log, so whatever an action logs reaches that endpoint unmasked.
# Nothing secret is logged today, but that rests on upstream code, and the
# other workflows hold the Cachix and flake-update tokens. Off everywhere, so
# no workflow is the exception. `diagnostic-endpoint: ""` on the installer
# step turns off the installer binary's separate report.
env:
  OTEL_SDK_DISABLED: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so preflight has origin/main and the commit it
          # compares against.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-02
        with:
          diagnostic-endpoint: ""

      # The same command a change is checked with locally: formatting, flake
      # check across all systems, every host's toplevel and every Home Manager
      # config evaluated, and which of them the change touches, written to the
      # run's summary. Evaluation only, so it needs no aarch64 builder and
      # cannot turn into a multi-hour build. scripts/preflight.sh says why
      # each step is there.
      #
      # On a pull request HEAD is the merge commit, so its merge-base with
      # origin/main is the base branch's tip, and the summary says what
      # merging would change.
      - run: nix run .#preflight
