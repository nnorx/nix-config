name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main @ 2026-09-02

      # --all-systems, because the runner is x86_64 and nix silently skips
      # aarch64 outputs without it: core4, core5 and lifeline were never
      # evaluated here, and a broken Pi config surfaced only in cache.yml,
      # after merge. Evaluation needs no aarch64 builder.
      #
      # --no-build keeps this an evaluation gate, so adding a `checks` output
      # later cannot turn it into a multi-hour aarch64 build.
      - run: nix flake check --all-systems --no-build
      - run: nix fmt -- --ci .
