name: Update flake.lock
on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-02
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.FLAKE_UPDATE_TOKEN }}
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # main @ 2026-09-02
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          pr-title: "flake: update inputs"
          pr-labels: dependencies
