name: Update flake.lock
on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

# The DeterminateSystems actions export OpenTelemetry traces and logs to their
# vendor by default, debug lines included. GitHub masks secrets only in the
# workflow log, so whatever an action logs reaches that endpoint unmasked.
# Nothing secret is logged today, but that rests on upstream code, and this job
# holds the flake-update token. `diagnostic-endpoint: ""` on the installer step
# turns off the installer binary's separate report.
env:
  OTEL_SDK_DISABLED: "true"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main @ 2026-09-02
        with:
          diagnostic-endpoint: ""
          extra-conf: |
            access-tokens = github.com=${{ secrets.FLAKE_UPDATE_TOKEN }}
      - uses: DeterminateSystems/update-flake-lock@01467157fe94fd33c160f7311a78689ceaad3ec4 # main @ 2026-09-02
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          pr-title: "flake: update inputs"
          pr-labels: dependencies
