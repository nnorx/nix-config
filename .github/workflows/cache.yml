name: Cache

# Builds every Pi's system closure on native aarch64 runners and pushes the
# result to Cachix, so the hosts substitute instead of compiling.
#
# This exists because linux_rpi4 is in no public cache: without it, a kernel
# bump costs each Pi 4 roughly 9-15 hours of compiling, separately, with no
# shared build output between them.
#
# GitHub's ubuntu-*-arm runners are free for public repositories and are real
# aarch64 hardware, so this is a native build rather than qemu emulation.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise runs but never cancel one in flight. Cancelling is the right default
# for test suites, where a superseded result is worthless — here it is the
# opposite: nix does not checkpoint partial builds, so killing a run discards
# the whole kernel compile, and the kernel derivation is usually identical
# between commits anyway (only a flake.lock change moves it). A superseded run
# still populates the cache with paths the next one would otherwise rebuild.
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false

# The DeterminateSystems installer exports OpenTelemetry traces and logs to its
# vendor by default, debug lines included. GitHub masks secrets only in the
# workflow log, so whatever the action logs reaches that endpoint unmasked.
# Nothing secret is logged today, but that rests on upstream code, and this job
# holds the Cachix push token every host trusts. `diagnostic-endpoint: ""` on
# the installer step turns off the installer binary's separate report.
env:
  OTEL_SDK_DISABLED: "true"

jobs:
  build:
    # Split by kernel, not by host. core4 and lifeline resolve to the *same*
    # Pi 4 kernel derivation, so they share a job and nix compiles it once.
    # core5's kernel comes from nixos-raspberrypi's cache, but its
    # page-size-16k overlay rebuilds rustc when nixpkgs bumps it, which takes
    # hours too. In one job, a lock bump that moves both could pass the
    # timeout below, and a timed-out run caches nothing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pi4
            hosts: core4 lifeline
          - name: core5
            hosts: core5
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    # A cold Pi 4 kernel build measured ~31 objects/min on the Pi itself
    # against a ~20-30k object config, i.e. 9-15h. These runners are perhaps
    # 3-5x quicker, so 2-5h. 180 was a guess and too tight; 350 sits just under
    # GitHub's 360-minute hard limit for hosted runners.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-09
        with:
          diagnostic-endpoint: ""

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nnorx-nix-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push via post-build hooks, so only paths this job actually *builds*
          # are uploaded. The default captures everything added to the store,
          # which would re-upload the several GB substituted from
          # cache.nixos.org and burn cache quota for no benefit.
          useDaemon: true

      - name: Build Pi system closures
        env:
          HOSTS: ${{ matrix.hosts }}
        run: |
          targets=()
          for h in $HOSTS; do
            targets+=(".#nixosConfigurations.$h.config.system.build.toplevel")
          done
          nix build --no-link --print-build-logs --accept-flake-config "${targets[@]}"
