name: Cache

# Builds every Pi's system closure on native aarch64 runners and pushes it to
# Cachix. The Pis substitute or fail (modules/baseline.nix), and the fleet's
# own derivations, the toplevels and everything generated for them, are in no
# public cache. Cachix skips what cache.nixos.org holds, so each push also
# carries what the job took from nixos-raspberrypi's cache, which the hosts do
# not trust.
#
# GitHub's ubuntu-*-arm runners are free for public repositories and are real
# aarch64 hardware, so this is a native build rather than qemu emulation.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The token only checks out the repo. Pushing to Cachix uses its own secret,
# so a hostile action or flake input in a job that holds that secret does not
# also find a token that can write to this repo, whatever the repository's
# default.
permissions:
  contents: read

# Serialise runs but never cancel one in flight: a superseded run still pushes
# paths the next one would otherwise build.
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false

# The DeterminateSystems installer exports OpenTelemetry traces and logs to its
# vendor by default, debug lines included. GitHub masks secrets only in the
# workflow log, so whatever the action logs reaches that endpoint unmasked.
# Nothing secret is logged today, but that rests on upstream code, and this job
# holds the Cachix push token every host trusts. `diagnostic-endpoint: ""` on
# the installer step turns off the installer binary's separate report.
env:
  OTEL_SDK_DISABLED: "true"

jobs:
  build:
    # Split by Pi model. core4 and lifeline share the Pi 4 kernel and most of
    # their closures, so they share a job. core5 has its own, so a failure
    # building one model's systems does not keep the other's from the cache.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pi4
            hosts: core4 lifeline
          - name: core5
            hosts: core5
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    # Every kernel and nearly every package comes from a public cache, and
    # jobs measured one to two minutes. 30 leaves room for a lock bump's
    # rebuilds of the fleet's own derivations. A job that needs more is
    # compiling something no public cache has, and should fail where it shows.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cachix pushes with its own secret, not git: no credentials kept.
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main @ 2026-09-09
        with:
          diagnostic-endpoint: ""

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nnorx-nix-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push via post-build hooks: each path this job builds, with the
          # part of its closure cache.nixos.org lacks. The default captures
          # everything added to the store, which would re-upload the several
          # GB substituted from cache.nixos.org and burn cache quota for no
          # benefit.
          useDaemon: true

      - name: Build Pi system closures
        env:
          HOSTS: ${{ matrix.hosts }}
        run: |
          targets=()
          for h in $HOSTS; do
            targets+=(".#nixosConfigurations.$h.config.system.build.toplevel")
          done
          # nixos-raspberrypi's cache, here rather than in flake.nix's nixConfig:
          # what this job substitutes from it is pushed with each closure. On
          # the command line, since cachix-action's `cachix use` writes a
          # `substituters =` list for the runner's user that replaces the
          # installer's extra-conf.
          nix build --no-link --print-build-logs --accept-flake-config \
            --extra-substituters https://nixos-raspberrypi.cachix.org \
            --extra-trusted-public-keys nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= \
            "${targets[@]}"
