# Actions are pinned to commit SHAs, which is what stops a moved tag or branch
# from handing a third party the Cachix push token in cache.yml. That token
# signs into a cache every host trusts as root, so the blast radius of a
# compromised action is the whole fleet.
#
# Pinning trades a supply-chain risk for a staleness one, so dependabot exists
# to close the second. It understands SHA pins and rewrites both the SHA and
# the trailing version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    # One PR for all four actions rather than one each. Reviewing an action
    # bump is a provenance question, not a behavioural one: does the SHA
    # resolve in the real upstream repo, and does it match the tag the trailing
    # comment claims. That judgement is the same for every action in a batch,
    # so splitting it across four PRs multiplies the ceremony without adding
    # any safety, and a queue of stale bumps is the failure pinning invites.
    #
    # Version updates only, which is the default and is wanted here: a security
    # update should arrive on its own and merge on its own rather than waiting
    # behind a routine bump.
    #
    # `cooldown` would be the other half of this, holding a release for a few
    # days so a compromised one has time to be caught. It does not support the
    # github-actions ecosystem, so there is nothing to set.
    groups:
      actions:
        patterns:
          - "*"
